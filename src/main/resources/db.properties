# デフォルトは H2（ファイル保存）。MySQL に切り替える場合は下のコメントを入れ替える。

db.driver=org.h2.Driver
db.url=jdbc:h2:./data/appdb;AUTO_SERVER=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE
db.user=sa
db.password=

